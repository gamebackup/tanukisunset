<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Tanuki Sunset</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/gamebackup/tanukisunset@refs/heads/main/TemplateData/style.css">
    <script src="https://cdn.jsdelivr.net/gh/gamebackup/tanukisunset@refs/heads/main/Build/UnityLoader.js"></script>
    <script>
  var buildUrl = "https://cdn.jsdelivr.net/gh/gamebackup/tanukisunset@main/Build/";
  var gameInstance = UnityLoader.instantiate("gameContainer", buildUrl + "WebGL.json", {
    dataUrl: buildUrl + "WebGL.data.unityweb",
    wasmCodeUrl: buildUrl + "WebGL.wasm.code.unityweb",
    wasmFrameworkUrl: buildUrl + "WebGL.wasm.framework.unityweb"
  });
</script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 960px; height: 600px"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Tanuki Sunset</div>
      </div>
    </div>
  </body>
</html>
